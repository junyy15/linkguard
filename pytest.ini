[pytest]
# Donde estan las pruebas.
testpaths = tests

# Etiquetas propias. Registrarlas aqui evita avisos de pytest y, sobre
# todo, permite correr o saltarse un grupo entero:
#
#   pytest -m "not red"    ->  solo las que no tocan internet (instantaneas)
#   pytest -m red          ->  solo las que si salen a la red
markers =
    red: la prueba sale a internet (lenta, puede fallar por el wifi)
    api: la prueba gasta cuota de una API externa

# -q  = salida corta
# -ra = al final, resumen de lo que no paso
addopts = -q -ra

# Avisos que no son culpa nuestra y solo ensucian la salida.
# Se silencian UNO POR UNO y con su motivo: silenciar todos los avisos
# es como apagar la alarma de incendios porque hace ruido.
filterwarnings =
    # starlette avisa que prefiere httpx2; es cosa de la libreria, no del
    # proyecto, y solo aparece al usar TestClient.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
